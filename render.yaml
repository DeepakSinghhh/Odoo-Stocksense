# One-click deploy on Render: New → Blueprint → pick this repo.
services:
  - type: web
    name: stocksense
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET
        generateValue: true
      # Free instances have no persistent disk: the demo data is re-seeded whenever
      # the service restarts. Add SMTP_* variables to email OTPs instead of showing them.
